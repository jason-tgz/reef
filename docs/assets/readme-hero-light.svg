<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" viewBox="38 18 846 402"><style>text{font-family:-apple-system,&apos;Segoe UI&apos;,Helvetica,Arial,sans-serif;fill:#22363e}.m{fill:#7a929a}.f{fill:#aabdc3}.a{fill:#0e7490}.big{font-size:18px;font-weight:600}.lab{font-size:14px}.sm{font-size:12.5px}.draw{stroke:#22363e}.draw,.draw-a,.draw-c,.draw-f{stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}.draw-f{stroke:#aabdc3}.draw-a{stroke:#0e7490}.draw-c{stroke:#d65f4a}.dash{stroke-dasharray:5 6}.fill-soft{fill:#e7f2f4}</style><defs><marker id="h-ink" markerHeight="7" markerWidth="7" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#22363E" d="M0 0 L10 5 L0 10 z"/></marker><marker id="h-faint" markerHeight="7" markerWidth="7" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#AABDC3" d="M0 0 L10 5 L0 10 z"/></marker><marker id="h-acc" markerHeight="7" markerWidth="7" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#0E7490" d="M0 0 L10 5 L0 10 z"/></marker><marker id="h-cor" markerHeight="7" markerWidth="7" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#D65F4A" d="M0 0 L10 5 L0 10 z"/></marker></defs><line x1="440" x2="440" y1="30" y2="374" stroke-width="1.5" class="draw-f dash"/><circle cx="440" cy="200" r="20" fill="#FFF" stroke="#DDE8EA" stroke-width="1.5"/><text x="440" y="205" class="sm m" font-weight="600" text-anchor="middle">vs</text><text x="220" y="42" class="lab m" font-size="15.5" font-weight="600" text-anchor="middle">an ordinary agent</text><g class="draw-f"><circle cx="80" cy="112" r="10"/><line x1="80" x2="80" y1="122" y2="156"/><line x1="80" x2="66" y1="134" y2="146"/><line x1="80" x2="94" y1="134" y2="146"/><line x1="80" x2="68" y1="156" y2="176"/><line x1="80" x2="92" y1="156" y2="176"/></g><rect width="112" height="54" x="250" y="98" class="draw-f" rx="10"/><text x="306" y="122" class="lab m" text-anchor="middle">a