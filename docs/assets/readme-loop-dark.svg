<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" viewBox="0 0 880 300"><style>text{font-family:-apple-system,&apos;Segoe UI&apos;,Helvetica,Arial,sans-serif;fill:#dce9ec}.m{fill:#8aa2aa}.f{fill:#5f777e}.a{fill:#45b2c6}.c{fill:#e57560}.lab{font-size:14px}.sm{font-size:12.5px}.draw{stroke:#dce9ec}.draw,.draw-a,.draw-c,.draw-f{stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}.draw-f{stroke:#5f777e}.draw-a{stroke:#45b2c6}.draw-c{stroke:#e57560}.dash{stroke-dasharray:5 6}</style><defs><marker id="l-ink" markerHeight="7" markerWidth="7" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#DCE9EC" d="M0 0 L10 5 L0 10 z"/></marker><marker id="l-faint" markerHeight="7" markerWidth="7" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#5F777E" d="M0 0 L10 5 L0 10 z"/></marker><marker id="l-acc" markerHeight="7" markerWidth="7" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#45B2C6" d="M0 0 L10 5 L0 10 z"/></marker><marker id="l-cor" markerHeight="7" markerWidth="7" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#E57560" d="M0 0 L10 5 L0 10 z"/></marker></defs><circle cx="185" cy="150" r="76" class="draw-a"/><path marker-end="url(#l-acc)" d="M 244 102 A 76 76 0 0 1 258 128" class="draw-a"/><path marker-end="url(#l-acc)" d="M 126 198 A 76 76 0 0 1 112 172" class="draw-a"/><circle cx="185" cy="74" r="5" fill="#45B2C6"/><text x="185" y="52" class="lab" font-weight="600" text-anchor="middle">serve</text><circle cx="261" cy="150" r="5" fill="#45B2C6"/><text x="282" y="156" class="lab" font-weight="600">observe</text><circle cx="185" cy="226" r="5" fill="#E57560"/><text x="185" y="262" class="lab" font-weight="600" text-anchor="middle">grow</text><circle cx="109" cy="150" r="5" fill="#45B2C6"/><text x="88" y="156" class="lab" font-weight="600" text-anchor="end">commit</text><text x="185" y="156" class="sm m" text-anchor="middle">keeps serving</text><path marker-end="url(#l-ink)" d="M 358 150 H 400" class="draw"/><text x="379" y="134" class="sm m" text-anchor="middle">each lap</text><g><circle cx="436" cy="150" r="15" class="draw-f"/><text x="436" y="155" class="sm f" text-anchor="middle">v1</text><path marker-end="url(#l-faint)" d="M455 150 H481" class="draw-f"/><circle cx="500" cy="150" r="15" class="draw-f"/><text x="500" y="155" class="sm f" text-anchor="middle">v2</text><path marker-end="url(#l-faint)" d="M519 150 H545" class="draw-f"/><circle cx="564" cy="150" r="15" class="draw-f"/><text x="564" y="155" class="sm f" text-anchor="middle">v3</text><path marker-end="url(#l-ink)" d="M583 150 H609" class="draw"/><circle cx="628" cy="150" r="15" class="draw"/><text x="628" y="155" class="sm" text-anchor="middle">v4</text><path marker-end="url(#l-ink)" d="M647 150 H673" class="draw"/><circle cx="692" cy="150" r="15" class="draw-a"/><text x="692" y="155" class="sm a" font-weight="600" text-anchor="middle">v5</text><path marker-end="url(#l-cor)" d="M711 150 H749" class="draw-c dash"/><text x="772" y="156" class="sm c" font-weight="600">v6…</text></g><text x="600" y="112" class="sm m" text-anchor="middle">one more link — serving continues throughout</text><path marker-end="url(#l-faint)" d="M 692 172 C 664 214, 534 214, 504 170" class="draw-f dash"/><text x="598" y="234" class="sm f" text-anchor="middle">roll back anytime</text></svg>